<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Modelo usado para gerar assets/og-image.jpg (1200x630). Não é publicado como página. -->
<link rel="stylesheet" href="../fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#fff;position:relative;overflow:hidden;font-family:"Cormorant Garamond",serif;color:#1f1f1d}
  .moldura{position:absolute;inset:26px;border:1.5px solid #1f1f1d}
  .fl{position:absolute}
  .topo{width:520px;top:-6px;left:-40px}
  .base{width:520px;bottom:-6px;right:-40px}
  .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .save{font-family:Montserrat,sans-serif;font-weight:500;font-size:20px;letter-spacing:.45em;margin-right:-.45em;text-transform:uppercase}
  .nomes{font-family:"Pinyon Script",cursive;font-size:132px;line-height:1.1;margin:18px 0 10px}
  .nomes span{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:64px;color:#5f7359;margin:0 14px}
  .data{font-family:Montserrat,sans-serif;font-size:20px;letter-spacing:.3em;margin-right:-.3em;text-transform:uppercase}
  .linha{width:70px;height:1px;background:#1f1f1d;opacity:.5;margin:8px 0 26px}
</style></head>
<body>
  <img class="fl topo" src="../assets/buque-topo.webp" alt="">
  <img class="fl base" src="../assets/buque-base.webp" alt="">
  <div class="moldura"></div>
  <div class="c">
    <p class="save">Save the Date</p>
    <h1 class="nomes">Caio<span>&amp;</span>Carol</h1>
    <div class="linha"></div>
    <p class="data">31 · outubro · 2026</p>
  </div>
</body></html>
