<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420">
  <!-- Buquê inferior: flores brancas em aquarela, folhagens verde-sálvia e ramos em traço fino.
       Para usar os seus elementos florais, substitua este arquivo por um PNG com fundo transparente
       e troque o caminho em index.html. -->
  <defs>
    <filter id="aquarela" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="11" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="7" xChannelSelector="R" yChannelSelector="G" result="borda"/>
      <feGaussianBlur in="borda" stdDeviation="0.6"/>
    </filter>
    <filter id="mancha" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" seed="5" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="30"/>
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <linearGradient id="petala" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c9cfbf"/>
      <stop offset="0.35" stop-color="#e7e8e0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="petalaQuente" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d8d2c3"/>
      <stop offset="0.4" stop-color="#efebe3"/>
      <stop offset="1" stop-color="#fffefb"/>
    </linearGradient>
    <linearGradient id="folha" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8fa38a"/>
      <stop offset="1" stop-color="#b9c8b1"/>
    </linearGradient>

    <path id="p" d="M0,0 C-20,-8 -27,-44 -6,-62 C-2,-65 2,-65 6,-62 C27,-44 20,-8 0,0Z"/>
    <path id="pLarga" d="M0,0 C-30,-6 -34,-46 -10,-60 C-4,-64 4,-64 10,-60 C34,-46 30,-6 0,0Z"/>
    <path id="f" d="M0,0 C11,-14 13,-40 0,-62 C-13,-40 -11,-14 0,0Z"/>
    <path id="fRedonda" d="M0,0 C16,-8 20,-30 0,-44 C-20,-30 -16,-8 0,0Z"/>

    <!-- flor aberta (anêmona / cosmos) -->
    <g id="flor">
      <g filter="url(#aquarela)" stroke="#b7b3a7" stroke-width="0.6" stroke-opacity="0.7">
        <use href="#pLarga" fill="url(#petala)" transform="rotate(0)"/>
        <use href="#pLarga" fill="url(#petalaQuente)" transform="rotate(60)"/>
        <use href="#pLarga" fill="url(#petala)" transform="rotate(120)"/>
        <use href="#pLarga" fill="url(#petalaQuente)" transform="rotate(180)"/>
        <use href="#pLarga" fill="url(#petala)" transform="rotate(240)"/>
        <use href="#pLarga" fill="url(#petalaQuente)" transform="rotate(300)"/>
        <use href="#p" fill="url(#petala)" transform="rotate(30) scale(.72)"/>
        <use href="#p" fill="url(#petalaQuente)" transform="rotate(102) scale(.7)"/>
        <use href="#p" fill="url(#petala)" transform="rotate(174) scale(.74)"/>
        <use href="#p" fill="url(#petalaQuente)" transform="rotate(246) scale(.7)"/>
        <use href="#p" fill="url(#petala)" transform="rotate(318) scale(.72)"/>
      </g>
      <circle r="11" fill="#dfe0c8" filter="url(#aquarela)"/>
      <g fill="#6f7654">
        <circle cx="-4" cy="-3" r="1.6"/><circle cx="3" cy="-5" r="1.4"/><circle cx="5" cy="2" r="1.6"/>
        <circle cx="-2" cy="4" r="1.5"/><circle cx="0" cy="0" r="1.8"/><circle cx="-6" cy="2" r="1.1"/>
        <circle cx="7" cy="-2" r="1"/><circle cx="2" cy="7" r="1"/>
      </g>
    </g>

    <!-- botão fechado -->
    <g id="botao">
      <g filter="url(#aquarela)" stroke="#b7b3a7" stroke-width="0.6" stroke-opacity="0.7">
        <use href="#p" fill="url(#petala)" transform="rotate(-18) scale(.55)"/>
        <use href="#p" fill="url(#petalaQuente)" transform="rotate(18) scale(.55)"/>
        <use href="#p" fill="url(#petala)" transform="scale(.5)"/>
      </g>
      <use href="#fRedonda" fill="#a7b89f" opacity=".85" transform="rotate(200) scale(.45)" filter="url(#aquarela)"/>
      <use href="#fRedonda" fill="#98ab91" opacity=".85" transform="rotate(160) scale(.45)" filter="url(#aquarela)"/>
    </g>

    <!-- ramo em traço fino -->
    <g id="ramo" fill="none" stroke="#2a2a2a" stroke-width="0.8" stroke-linecap="round">
      <path d="M0,0 C10,-40 12,-90 4,-140"/>
      <path d="M3,-20 C-10,-26 -16,-40 -12,-50 C-2,-44 3,-32 3,-20Z"/>
      <path d="M6,-38 C18,-44 26,-58 22,-68 C11,-62 6,-50 6,-38Z"/>
      <path d="M8,-62 C-4,-70 -8,-84 -4,-94 C6,-86 9,-74 8,-62Z"/>
      <path d="M8,-84 C20,-90 26,-102 23,-112 C13,-106 8,-96 8,-84Z"/>
      <path d="M6,-108 C-4,-114 -7,-126 -3,-134 C5,-128 7,-118 6,-108Z"/>
    </g>

    <!-- eucalipto em traço fino -->
    <g id="eucalipto" fill="none" stroke="#2a2a2a" stroke-width="0.75">
      <path d="M0,0 C-6,-40 -2,-80 10,-120"/>
      <ellipse cx="-12" cy="-22" rx="10" ry="8"/>
      <ellipse cx="10" cy="-44" rx="10" ry="8"/>
      <ellipse cx="-12" cy="-66" rx="9" ry="7"/>
      <ellipse cx="14" cy="-88" rx="8" ry="6.5"/>
      <ellipse cx="-2" cy="-108" rx="7" ry="5.5"/>
    </g>
  </defs>

  <g filter="url(#mancha)" opacity=".3">
    <ellipse cx="110" cy="320" rx="95" ry="65" fill="#c7d3c1"/>
  </g>
  <use href="#eucalipto" transform="translate(70 285) rotate(18) scale(1)"/>
  <use href="#ramo" transform="translate(190 335) rotate(72) scale(.85)"/>
  <use href="#ramo" transform="translate(140 270) rotate(35) scale(.65)"/>
  <g filter="url(#aquarela)" style="mix-blend-mode:multiply">
    <use href="#f" fill="url(#folha)" opacity=".75" transform="translate(140 320) rotate(65) scale(1.3)"/>
    <use href="#f" fill="#a5b79e" opacity=".7" transform="translate(130 330) rotate(25) scale(1.1)"/>
    <use href="#f" fill="url(#folha)" opacity=".7" transform="translate(75 305) rotate(-5) scale(1.2)"/>
    <use href="#fRedonda" fill="#b3c3ab" opacity=".7" transform="translate(100 310) rotate(30) scale(1)"/>
    <use href="#fRedonda" fill="#8ea287" opacity=".6" transform="translate(40 340) rotate(-40) scale(1)"/>
    <use href="#f" fill="#9db196" opacity=".65" transform="translate(180 365) rotate(85) scale(1)"/>
  </g>
  <use href="#flor" transform="translate(95 345) rotate(-15) scale(1.05)"/>
  <use href="#flor" transform="translate(45 255) rotate(25) scale(.6)"/>
  <use href="#botao" transform="translate(185 320) rotate(70) scale(.9)"/>
</svg>
